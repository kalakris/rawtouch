<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RawTouch bounce bench</title>
<style>
  body { margin: 0; font: 14px -apple-system, sans-serif; }
  .row { height: 100px; box-sizing: border-box; padding: 8px 16px; border-bottom: 1px solid #ddd; color: #666; }
  .row:nth-child(odd) { background: #f6f6f6; }
  #hud { position: fixed; top: 8px; right: 8px; background: #111; color: #0f0;
         font: 12px ui-monospace, monospace; padding: 6px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="hud">scrollY 0</div>
<script>
  // Per-frame scroll position log, read back by run.py through
  // "do JavaScript" (Develop → Allow JavaScript from Apple Events).
  window.__log = [];
  let t0 = performance.now();
  const hud = document.getElementById('hud');
  function tick() {
    const y = window.scrollY;
    window.__log.push([Math.round(performance.now() - t0), Math.round(y)]);
    if (window.__log.length > 6000) window.__log.shift();
    hud.textContent = 'scrollY ' + Math.round(y);
    requestAnimationFrame(tick);
  }
  window.__reset = function (y) {
    window.scrollTo(0, y);
    window.__log = [];
    t0 = performance.now();
    return window.scrollY;
  };
  window.__dump = function () { return JSON.stringify(window.__log); };
  for (let i = 0; i < 400; i++) {
    const d = document.createElement('div');
    d.className = 'row';
    d.textContent = 'row ' + i;
    document.body.appendChild(d);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
